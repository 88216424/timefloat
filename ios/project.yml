# XcodeGen 工程描述：单 target，就一个 App。
# 用法（Mac 上）：brew install xcodegen && cd ios && xcodegen generate && open TimeFloat.xcodeproj
name: TimeFloat

options:
  bundleIdPrefix: com.yesha
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TimeFloat:
    type: application
    platform: iOS
    sources:
      - path: TimeFloat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yesha.timefloat
        PRODUCT_NAME: TimeFloat
        INFOPLIST_FILE: TimeFloat/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # 桌面图标：Assets.xcassets/AppIcon.appiconset 里有全套尺寸
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# 显式声明共享 scheme：保证在 CI（xcodebuild -scheme TimeFloat）里一定能找到
schemes:
  TimeFloat:
    build:
      targets:
        TimeFloat: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
